  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <circle cx="1090" cy="40" r="120" fill="#FFFFFF" fill-opacity="0.07"/>
  <circle cx="1010" cy="260" r="90" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="90" cy="250" r="70" fill="#FFFFFF" fill-opacity="0.05"/>
